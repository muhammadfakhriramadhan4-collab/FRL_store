<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRL TOP UP - Top Up Game Murah & Cepat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:linear-gradient(180deg,#0f0c29,#302b63,#24243e);color:white;padding-bottom:90px}
header{padding:16px;text-align:center;background:rgba(0,0,0,.3)}
header h1{font-size:26px} header h1 span{color:#a855f7}
header p{font-size:13px;opacity:.8;margin-top:4px}
.banner{margin:14px;border-radius:16px;overflow:hidden;background:linear-gradient(90deg,#7c3aed,#db2777);padding:18px}
.banner h2{font-size:20px} .banner p{font-size:13px;margin-top:6px;opacity:.9}
.banner button{margin-top:10px;background:white;color:#7c3aed;border:0;padding:8px 14px;border-radius:20px;font-weight:700}
.section{padding:0 14px;margin-top:18px}
.section h3{margin-bottom:10px}
.games{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.game{background:#1e1b3a;border:1px solid #333;border-radius:14px;padding:8px;text-align:center;cursor:pointer}
.game.active{border:2px solid #a855f7;background:#2e1a5a}
.game img{width:100%;height:58px;object-fit:cover;border-radius:10px;background:#333}
.game p{font-size:11px;margin-top:6px}
.card{background:white;color:#111;border-radius:16px;padding:16px;margin:14px}
.card label{font-size:13px;font-weight:700}
.card input,.card select{width:100%;padding:11px;border:1.5px solid #ddd;border-radius:10px;margin:8px 0}
.card input:focus{border-color:#7c3aed;outline:none}
#serverBox{display:none}
.note{font-size:12px;color:#666}
.btn-cek{width:100%;background:#111;color:white;padding:11px;border:0;border-radius:10px;font-weight:700}
.btn-cek.ok{background:#16a34a}
.nominal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.nom{border:1.5px solid #ddd;border-radius:12px;padding:10px;cursor:pointer}
.nom.active{border-color:#7c3aed;background:#f3e8ff}
.nom b{font-size:14px} .nom span{font-size:12px;color:#7c3aed;font-weight:700}
.pay{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.pay-item{border:1.5px solid #ddd;border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px;cursor:pointer;background:white}
.pay-item.active{border-color:#7c3aed;background:#f3e8ff}
.pay-item img{width:40px;height:40px;object-fit:contain}
.pay-item span{font-size:13px;font-weight:700;color:#111}
.qris-box{text-align:center;display:none;margin-top:12px;border:1px dashed #999;padding:12px;border-radius:12px}
.qris-box img{width:180px;height:180px}
.total{display:flex;justify-content:space-between;margin-top:14px;font-weight:700}
.btn-beli{width:100%;background:linear-gradient(90deg,#7c3aed,#db2777);color:white;border:0;padding:14px;border-radius:12px;font-weight:800;font-size:15px;margin-top:12px}
.cs{position:fixed;right:14px;bottom:14px;background:#25D366;color:white;padding:12px 16px;border-radius:30px;text-decoration:none;font-weight:700;box-shadow:0 5px 15px rgba(0,0,0,.4);z-index:99}
footer{padding:18px;text-align:center;font-size:12px;opacity:.7}
footer b{color:white}
</style>
</head>
<body>

<header>
<h1>FRL <span>TOP UP</span></h1>
<p>Top Up Game Murah • Cepat • Aman • 24 Jam • CS Siaga</p>
</header>

<div class="banner">
<h2>🔥 PROMO HARI INI!</h2>
<p>Diskon s/d 20% untuk Mobile Legends & Free Fire! Bayar pake DANA / OVO / GoPay langsung masuk!</p>
<button onclick="document.getElementById('games').scrollIntoView({behavior:'smooth'})">Lihat Game →</button>
</div>

<div class="section" id="games">
<h3>🎮 Pilih Game Kamu</h3>
<div class="games" id="gameList"></div>
</div>

<div class="card">
<label>1. Masukkan User ID</label>
<input type="text" id="userId" placeholder="Contoh: 123456789" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,''); resetCek()">
<div id="serverBox">
<label>Server</label>
<select id="server"><option>Asia</option><option>Amerika</option><option>Eropa</option></select>
</div>
<div id="mlServerBox" style="display:none">
<label>Zone ID (Server ML)</label>
<input type="text" id="zoneId" placeholder="Contoh: 1234" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
</div>
<p class="note
