<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRL TOP UP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:linear-gradient(180deg,#0f0c29,#302b63,#24243e);color:white;padding-bottom:90px}
header{padding:16px;text-align:center}
header h1{font-size:28px} header h1 span{color:#a855f7}
header p{font-size:13px;opacity:.8}
.banner{margin:14px;border-radius:16px;background:linear-gradient(90deg,#7c3aed,#db2777);padding:18px}
.banner button{margin-top:10px;background:white;color:#7c3aed;border:0;padding:8px 14px;border-radius:20px;font-weight:700}
.section{padding:0 14px;margin-top:18px}
.games{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.game{background:#1e1b3a;border:1px solid #333;border-radius:14px;padding:8px;text-align:center;cursor:pointer}
.game.active{border:2px solid #a855f7;background:#2e1a5a}
.game img{width:100%;height:58px;object-fit:cover;border-radius:10px;background:#444}
.game p{font-size:11px;margin-top:6px}
.card{background:white;color:#111;border-radius:16px;padding:16px;margin:14px}
.card label{font-size:13px;font-weight:700}
.card input,.card select{width:100%;padding:11px;border:1.5px solid #ddd;border-radius:10px;margin:8px 0}
.btn-cek{width:100%;background:#111;color:white;padding:11px;border:0;border-radius:10px;font-weight:700}
.btn-cek.ok{background:#16a34a}
.nominal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.nom{border:1.5px solid #ddd;border-radius:12px;padding:10px;cursor:pointer}
.nom.active{border-color:#7c3aed;background:#f3e8ff}
.pay{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.pay-item{border:1.5px solid #ddd;border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px;cursor:pointer}
.pay-item.active{border-color:#7c3aed;background:#f3e8ff}
.pay-item img{width:40px;height:40px;object-fit:contain}
.pay-item b{font-size:13px}
.qris-box{text-align:center;display:none;margin-top:12px;border:1px dashed #999;padding:12px;border-radius:12px}
.qris-box img{width:180px;height:180px}
.btn-beli{width:100%;background:linear-gradient(90deg,#7c3aed,#db2777);color:white;border:0;padding:14px;border-radius:12px;font-weight:800;margin-top:12px}
.cs{position:fixed;right:14px;bottom:14px;background:#25D366;color:white;padding:12px 16px;border-radius:30px;text-decoration:none;font-weight:700;z-index:99}
footer{padding:18px;text-align:center;font-size:12px;opacity:.7}
</style>
</head>
<body>
<header><h1>FRL <span>TOP UP</span></h1><p>Top Up Game Murah • Cepat • Aman • 24 Jam • CS Siaga</p></header>
<div class="banner"><h2>🔥 PROMO HARI INI!</h2><p>Diskon s/d 20% untuk Mobile Legends & Free Fire! Bayar pake DANA / OVO / GoPay langsung masuk!</p><button onclick="document.getElementById('games').scrollIntoView({behavior:'smooth'})">Lihat Game →</button></div>

<div class="section" id="games"><h3>🎮 Pilih Game Kamu</h3><div class="games" id="gameList"></div></div>

<div class="card">
<label>1. Masukkan User ID</label>
<input type="text" id="userId" placeholder="Contoh: 123456789">
<div id="serverBox" style="display:none"><label>Server</label><select id="server"><option>Asia</option><option>Amerika</option><option>Eropa</option></select></div>
<div id="mlBox" style="display:none"><label>Zone ID (Server ML)</label><input type="text" id="zoneId" placeholder="Contoh: 1234"></div>
<p id="gameNote" style="font-size:12px;color:#666">Pilih game dulu ya!</p>
<button class="btn-cek" id="cekBtn">CEK ID</button>
<p id="cekResult" style="font-size:13px;margin-top:8px"></p>
<label style="margin-top:14px;display:block">2. Pilih Nominal</label>
<div class="nominal" id="nominalList"></div>
<label style="margin-top:14px;display:block">3. Pilih Pembayaran</label>
<div class="pay" id="payList"></div>
<div class="qris-box" id="qrisBox"><p><b>Scan QRIS Ini</b></p><img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=FRLTOPUP"><p style="font-size:12px">FRL TOP UP</p></div>
<div style="display:flex;justify-content:space-between;margin-top:14px;font-weight:700"><span>Total Bayar</span><span id="totalTxt">Rp 0</span></div>
<button class="btn-beli" id="beliBtn">BELI SEKARANG</button>
</div>
<footer><b>FRL TOP UP</b><br>Toko Top Up Terpercaya •
