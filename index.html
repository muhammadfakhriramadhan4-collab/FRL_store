<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRL STORE - FINAL RAPI</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@600;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,Arial;background:#eef1f8}.top{height:56px;background:#0a194e;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#fff;position:sticky;top:0;z-index:99;border-bottom:2px solid #d4af37}.logo{font-family:Playfair Display;font-weight:900;font-size:22px}.logo b{color:#d4af37}.cart{position:relative;background:#f0c75e;color:#000;padding:8px 16px;border-radius:20px;font-weight:900;font-size:12px;border:none;cursor:pointer}.cart span{position:absolute;top:-6px;right:-6px;background:red;color:#fff;width:18px;height:18px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center}.hero{background:#0a194e;text-align:center;padding:14px 10px}.hero h1{font-family:Playfair Display;color:#f0c75e;font-size:20px}.mid{max-width:900px;margin:auto;padding:12px}.mid h2{text-align:center;font-family:Playfair Display;font-size:14px;color:#0a194e}.mid .sub{text-align:center;font-size:11px;color:#64748b;margin-bottom:12px}.grid{display:grid;grid-template-columns:380px 1fr;gap:12px}@media(max-width:768px){.grid{grid-template-columns:1fr}}.big{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.12);border:2px solid #e9d8a0}.big .img{padding:20px;background:#fff;display:flex;align-items:center;justify-content:center}.big .img img{width:100%;max-width:360px;height:auto}.small{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sm{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08);border:1px solid #e5e7eb;position:relative;display:flex;flex-direction:column}.sm .img{padding:24px 8px 8px;display:flex;align-items:center;justify-content:center;flex:1;background:#fff}.sm .img img{width:100%;max-width:180px;height:auto}.sm .info{padding:10px;text-align:center;border-top:1px solid #f1f5f9}.pr{font-weight:900;color:#0a194e}.tag{position:absolute;left:8px;top:8px;font-size:8px;font-weight:900;padding:4px 10px;border-radius:6px;color:#fff}.btn{width:100%;padding:9px;border:none;border-radius:8px;background:#0a194e;color:#fff;font-weight:800;font-size:11px;margin-top:6px;cursor:pointer}.btn-wa{display:block;width:100%;padding:8px;border-radius:8px;background:#25D366;color:#fff;font-weight:800;font-size:10px;margin-top:5px;text-decoration:none;text-align:center}.foot{background:#0a194e;color:#f0c75e;display:flex;justify-content:center;gap:12px;padding:10px;font-size:9px;font-weight:700;flex-wrap:wrap}.bar{position:fixed;bottom:12px;left:12px;right:12px;background:#0a194e;color:#f0c75e;padding:12px;border-radius:24px;text-align:center;font-weight:900;z-index:99;display:none;border:none;cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;padding:12px;display:flex;align-items:center;justify-content:center}.hide{display:none}.box{background:#fff;border-radius:12px;width:100%;max-width:400px;padding:16px;max-height:85vh;overflow:auto}</style></head><body><div class="top"><div class="logo">👑 FRL <b>STORE</b></div><button id="topCart" class="cart" type="button">🛒 KERANJANG <span id="cn">0</span></button></div><div class="hero"><h1>✨ PREMIUM COLLECTION ✨</h1>
